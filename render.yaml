services:
  - type: web
    name: kronos-military-management
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true

databases:
  - name: kronos-postgres
    plan: free
    databaseName: kronos
    user: kronos

